<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Northstar Supply</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <header class="site-header">
      <p class="eyebrow">Northstar Supply</p>
      <h1>Field essentials for the long way round</h1>
    </header>
    <main>
      <section class="product-grid" aria-label="Product catalogue">
        <article class="product-card" data-product-id="aurora-lamp">
          <img src="/legacy-assets/products/aurora-lamp.svg" alt="Aurora camp lamp">
          <div class="product-copy">
            <h2>Aurora Camp Lamp</h2>
            <p>Warm, dimmable light in a weather-ready shell.</p>
          </div>
        </article>
        <article class="product-card" data-product-id="harbor-pack">
          <img src="/legacy-assets/products/harbor-pack.svg" alt="Harbor day pack">
          <div class="product-copy">
            <h2>Harbor Day Pack</h2>
            <p>A compact carry with a dry-lined inner pocket.</p>
          </div>
        </article>
        <article class="product-card" data-product-id="mesa-mug">
          <img src="/legacy-assets/products/mesa-mug.svg" alt="Mesa trail mug">
          <div class="product-copy">
            <h2>Mesa Trail Mug</h2>
            <p>Double-wall steel sized for camp and commute.</p>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
